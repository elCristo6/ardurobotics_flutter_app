name: Deploy Ardurobotics Flutter Web

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar Flutter Web
        run: flutter build web --release

      - name: Desplegar en S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
        run: |
          echo "Bucket destino: $AWS_S3_BUCKET_NAME"
          echo "Archivos generados:"
          ls -lah build/web
          echo "Subiendo archivos..."
          aws s3 sync build/web "s3://$AWS_S3_BUCKET_NAME/" --delete
          echo "Contenido del bucket después del deploy:"
          aws s3 ls "s3://$AWS_S3_BUCKET_NAME/"