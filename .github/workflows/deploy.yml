name: Deploy Ardurobotics Flutter Web

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar Flutter Web
        run: flutter build web --release

      - name: Desplegar Ardurobotics en S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          echo "Desplegando exclusivamente en Ardurobotics..."
          aws s3 sync build/web s3://ardurobotics.udelectronics.com/
          echo "Contenido del bucket Ardurobotics:"
          aws s3 ls s3://ardurobotics.udelectronics.com/